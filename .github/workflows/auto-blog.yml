name: Auto Blog
# GitHub cron is UTC and may be delayed. IST = UTC+5:30:
#   03:30 UTC = 09:00 IST, 07:30 = 13:00, 11:30 = 17:00, 15:30 = 21:00
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 7 * * *"
    - cron: "30 11 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["posts.json", "published.json", "review.json", "README.md"]
concurrency:
  group: trendpulse-pipeline
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run pipeline
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then python engine.py --render-only; else python engine.py; fi
      - name: Commit changes
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json published.json review.json index.html en hi sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: update content [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site directory
        run: python engine.py --build-site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

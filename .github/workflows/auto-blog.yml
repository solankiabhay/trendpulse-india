name: Auto Blog
# Check feeds every 2 hours (GitHub cron is UTC and may be delayed).
# This improves freshness without requiring a paid API.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      unpublish_ids:
        description: "Optional: space-separated post IDs to remove, e.g. en-0123456789"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore: ["posts.json", "published.json", "review.json", "README.md"]
concurrency:
  group: trendpulse-pipeline
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-translation.txt
      - name: Cache Argos translation model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-hi-v1
      - name: Install English-to-Hindi model (best effort)
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO)
          try:
              import argostranslate.package
              argostranslate.package.update_package_index()
              import argostranslate.translate
              langs = argostranslate.translate.get_installed_languages()
              en = next((lang for lang in langs if lang.code == "en"), None)
              hi = next((lang for lang in langs if lang.code == "hi"), None)
              installed = False
              if en is not None and hi is not None:
                  try:
                      en.get_translation(hi)
                      installed = True
                  except (ValueError, LookupError):
                      installed = False
              if not installed:
                  packages = argostranslate.package.get_available_packages()
                  package = next(p for p in packages if p.from_code == "en" and p.to_code == "hi")
                  argostranslate.package.install_from_path(package.download())
              print("Argos English-to-Hindi model is ready.")
          except Exception as exc:
              print(f"WARNING: local Hindi translator unavailable; English-only snippets will be skipped: {exc}")
          PY
      - name: Unpublish requested posts
        env:
          IDS: ${{ github.event.inputs.unpublish_ids }}
        run: |
          for id in $IDS; do python engine.py --unpublish "$id"; done
      - name: Regenerate pages from stored posts
        run: python engine.py --render-only
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then python engine.py --refresh-only; else python engine.py; fi
      - name: Commit changes
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json published.json review.json unpublished.json index.html en hi sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: update content [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
